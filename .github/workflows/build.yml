name: Build Neoprisma

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use py 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"


      - name: Build
        run: |
          curl -fsSL https://raw.githubusercontent.com/PrismaticDepths/neoprisma/stable/install.sh | $SHELL -s -- -y -s -i "$HOME/npadist" -b "$HOME/npabuild"
      
      - name: Tar app bundle
        run: |
          cd "$HOME/npadist"
          tar -cJpf neoprisma-macos.tar.xz neoprisma.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: "$HOME/npadist/neoprisma-macos.tar.xz"
