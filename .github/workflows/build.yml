name: Build Neoprisma

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release is from stable branch
        run: |
          TARGET="${{ github.event.release.target_commitish }}"
          COMMIT_ID="${TARGET:-$GITHUB_SHA}"

          echo "Checking if commit $COMMIT_ID is on origin/stable..."

          if ! git branch -r --contains "$COMMIT_ID" | grep -q "origin/stable$"; then
            echo "Bad news: Release commit is not on the stable branch."
            exit 1
          fi
          echo "Good news: Release commit is verified on stable branch."

      - name: Use py 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"


      - name: Build
        run: |
          curl -fsSL https://raw.githubusercontent.com/PrismaticDepths/neoprisma/stable/install.sh | $SHELL -s -- -y -s -i "$PWD/dist" -b "$PWD/build"
      
      - name: Tar app bundle
        run: |
          cd "$PWD/dist"
          tar -cJf neoprisma-macos.tar.xz neoprisma.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: "$PWD/dist/neoprisma-macos.tar.xz"
