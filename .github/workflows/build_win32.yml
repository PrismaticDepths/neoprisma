name: Build Neoprisma (Windows)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use py 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://raw.githubusercontent.com/PrismaticDepths/neoprisma/stable/install.ps1))) -y YES -s YES -i "${{ github.workspace }}\npadist" -b "${{ github.workspace }}\npabuild"

      - name: Tar app bundle
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}\npadist"
          tar -cJpf neoprisma-win32.tar.xz neoprisma

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win32-app
          path: "npadist/neoprisma-win32.tar.xz"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: npadist/neoprisma-win32.tar.xz